/* ---------- Design tokens ---------- */
:root {
  --cream:        #F0EEE6;  /* 页面背景 */
  --cream-soft:   #FAF9F5;  /* 代码、引用、表头 */
  --ink:          #1F1B16;  /* 正文 */
  --ink-soft:     #3D3929;  /* 次要文字、h2 */
  --muted:        #6B6557;  /* 说明文字、页码 */
  --rule:         #DAD5C5;  /* 细分割线 */
  --coral:        #CC785C;  /* 主强调色 */
  --coral-deep:   #BD5D3A;  /* 链接、h3、加粗 */
  --coral-soft:   #E8C4B0;  /* 标题页光晕、分隔页点缀 */
  }

/* ---------- 基础版式（中文：Noto Sans SC + 系统黑体回退） ---------- */
section {
  font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 30px;
  color: var(--ink);
  background: var(--cream);
  padding: 60px 72px 56px 72px;
  line-height: 1.55;
  letter-spacing: 0;
}

/* ---------- 标题（中文：Noto Serif SC 宋体系，与 Fraunces 搭配） ---------- */
h1, h2, h3 {
  font-family: 'Fraunces', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', Georgia, serif;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.25;
}
h1 {
  font-size: 44px;
  margin: 0 0 0.25em 0;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--rule);
}
h2 { font-size: 32px; color: var(--ink-soft); margin: 0 0 0.3em 0; }
h3 { font-size: 26px; color: var(--coral-deep); }

/* ---------- 行内元素 ---------- */
strong { color: var(--coral-deep); font-weight: 600; }
em     { color: var(--ink-soft); }
a      { color: var(--coral-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 引用块 ---------- */
blockquote {
  border-left: 3px solid var(--coral);
  background: var(--cream-soft);
  padding: 14px 22px;
  margin: 18px 0;
  color: var(--ink-soft);
  font-style: normal;
}

/* ---------- 插图（居中，§3-15） ---------- */
/* ![w:NNNpx] 只设宽度，图片默认块级左对齐；需 display:block + margin auto 居中
   （社区先例：marp-team discussion #430；本机实测） */
img { display: block; margin: 0 auto; }

/* ---------- 代码 ---------- */
code, pre {
  font-family: 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace;
  background: var(--cream-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.9em;
}
pre { padding: 12px 16px; }

/* ---------- 表格 ---------- */
table {
  font-size: 24px;
  border-collapse: collapse;
  margin: 12px 0;
  width: 100%;
}
th {
  background: var(--cream-soft);
  color: var(--ink-soft);
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--coral);
  padding: 10px 14px;
}
td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
}

/* ---------- 表格居中页: &lt;!-- _class: centered-table --&gt; ---------- */
section.centered-table table {
  width: fit-content !important;
  margin: 12px auto !important;
}

/* ---------- 列表 ---------- */
ul, ol { margin: 0.4em 0 0.4em 1.1em; padding: 0; }
li     { margin: 0.25em 0; }
li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);
  font-size: 56px;
}
section.divider strong { color: var(--coral-soft); }

/* ---------- 编号右对齐（KaTeX \tag 机制） ---------- */
/* \tag{n} 由 KaTeX 自动加括号渲染为 (n)；marp 的 .katex/.katex-html 自带
   position:relative（内容宽度盒），会把 tag 的包含块锁死在内容盒上，
   故强制 display 层 relative、内两层 static，tag 的 right:0 落在内容区右缘。 */
.katex-display { position: relative; }
.katex-display &gt; .katex { position: static; }
.katex-display &gt; .katex &gt; .katex-html { position: static; }

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);
  font-size: 56px;
}
section.divider strong { color: var(--coral-soft); }

/* ---------- Design tokens ---------- */
:root {
  --cream:        #F0EEE6;  /* 页面背景 */
  --cream-soft:   #FAF9F5;  /* 代码、引用、表头 */
  --ink:          #1F1B16;  /* 正文 */
  --ink-soft:     #3D3929;  /* 次要文字、h2 */
  --muted:        #6B6557;  /* 说明文字、页码 */
  --rule:         #DAD5C5;  /* 细分割线 */
  --coral:        #CC785C;  /* 主强调色 */
  --coral-deep:   #BD5D3A;  /* 链接、h3、加粗 */
  --coral-soft:   #E8C4B0;  /* 标题页光晕、分隔页点缀 */
  }

/* ---------- 基础版式（中文：Noto Sans SC + 系统黑体回退） ---------- */
section {
  font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 30px;
  color: var(--ink);
  background: var(--cream);
  padding: 60px 72px 56px 72px;
  line-height: 1.55;
  letter-spacing: 0;
}

/* ---------- 标题（中文：Noto Serif SC 宋体系，与 Fraunces 搭配） ---------- */
h1, h2, h3 {
  font-family: 'Fraunces', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', Georgia, serif;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.25;
}
h1 {
  font-size: 44px;
  margin: 0 0 0.25em 0;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--rule);
}
h2 { font-size: 32px; color: var(--ink-soft); margin: 0 0 0.3em 0; }
h3 { font-size: 26px; color: var(--coral-deep); }

/* ---------- 行内元素 ---------- */
strong { color: var(--coral-deep); font-weight: 600; }
em     { color: var(--ink-soft); }
a      { color: var(--coral-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 引用块 ---------- */
blockquote {
  border-left: 3px solid var(--coral);
  background: var(--cream-soft);
  padding: 14px 22px;
  margin: 18px 0;
  color: var(--ink-soft);
  font-style: normal;
}

/* ---------- 插图（居中，§3-15） ---------- */
/* ![w:NNNpx] 只设宽度，图片默认块级左对齐；需 display:block + margin auto 居中
   （社区先例：marp-team discussion #430；本机实测） */
img { display: block; margin: 0 auto; }

/* ---------- 代码 ---------- */
code, pre {
  font-family: 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace;
  background: var(--cream-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.9em;
}
pre { padding: 12px 16px; }

/* ---------- 表格 ---------- */
table {
  font-size: 24px;
  border-collapse: collapse;
  margin: 12px 0;
  width: 100%;
}
th {
  background: var(--cream-soft);
  color: var(--ink-soft);
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--coral);
  padding: 10px 14px;
}
td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
}

/* ---------- 表格居中页: &lt;!-- _class: centered-table --&gt; ---------- */
section.centered-table table {
  width: fit-content !important;
  margin: 12px auto !important;
}

/* ---------- 列表 ---------- */
ul, ol { margin: 0.4em 0 0.4em 1.1em; padding: 0; }
li     { margin: 0.25em 0; }
li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;

/* ---------- Design tokens ---------- */
:root {
  --cream:        #F0EEE6;  /* 页面背景 */
  --cream-soft:   #FAF9F5;  /* 代码、引用、表头 */
  --ink:          #1F1B16;  /* 正文 */
  --ink-soft:     #3D3929;  /* 次要文字、h2 */
  --muted:        #6B6557;  /* 说明文字、页码 */
  --rule:         #DAD5C5;  /* 细分割线 */
  --coral:        #CC785C;  /* 主强调色 */
  --coral-deep:   #BD5D3A;  /* 链接、h3、加粗 */
  --coral-soft:   #E8C4B0;  /* 标题页光晕、分隔页点缀 */
  }

/* ---------- 基础版式（中文：Noto Sans SC + 系统黑体回退） ---------- */
section {
  font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 30px;
  color: var(--ink);
  background: var(--cream);
  padding: 60px 72px 56px 72px;
  line-height: 1.55;
  letter-spacing: 0;
}

/* ---------- 标题（中文：Noto Serif SC 宋体系，与 Fraunces 搭配） ---------- */
h1, h2, h3 {
  font-family: 'Fraunces', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', Georgia, serif;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.25;
}
h1 {
  font-size: 44px;
  margin: 0 0 0.25em 0;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--rule);
}
h2 { font-size: 32px; color: var(--ink-soft); margin: 0 0 0.3em 0; }
h3 { font-size: 26px; color: var(--coral-deep); }

/* ---------- 行内元素 ---------- */
strong { color: var(--coral-deep); font-weight: 600; }
em     { color: var(--ink-soft); }
a      { color: var(--coral-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 引用块 ---------- */
blockquote {
  border-left: 3px solid var(--coral);
  background: var(--cream-soft);
  padding: 14px 22px;
  margin: 18px 0;
  color: var(--ink-soft);
  font-style: normal;
}

/* ---------- 插图（居中，§3-15） ---------- */
/* ![w:NNNpx] 只设宽度，图片默认块级左对齐；需 display:block + margin auto 居中
   （社区先例：marp-team discussion #430；本机实测） */
img { display: block; margin: 0 auto; }

/* ---------- 代码 ---------- */
code, pre {
  font-family: 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace;
  background: var(--cream-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.9em;
}
pre { padding: 12px 16px; }

/* ---------- 表格 ---------- */
table {
  font-size: 24px;
  border-collapse: collapse;
  margin: 12px 0;
  width: 100%;
}
th {
  background: var(--cream-soft);
  color: var(--ink-soft);
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--coral);
  padding: 10px 14px;
}
td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
}

/* ---------- 表格居中页: &lt;!-- _class: centered-table --&gt; ---------- */
section.centered-table table {
  width: fit-content !important;
  margin: 12px auto !important;
}

/* ---------- 列表 ---------- */
ul, ol { margin: 0.4em 0 0.4em 1.1em; padding: 0; }
li     { margin: 0.25em 0; }
li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);
  font-size: 56px;
}
section.divider strong { color: var(--coral-soft); }

/* ---------- 编号右对齐（KaTeX \tag 机制） ---------- */
/* \tag{n} 由 KaTeX 自动加括号渲染为 (n)；marp 的 .katex/.katex-html 自带
   position:relative（内容宽度盒），会把 tag 的包含块锁死在内容盒上，
   故强制 display 层 relative、内两层 static，tag 的 right:0 落在内容区右缘。 */
.katex-display { position: relative; }
.katex-display &gt; .katex { position: static; }
.katex-display &gt; .katex &gt; .katex-html { position: static; }

<h1 id="%E7%9F%A9%E9%98%B5%E8%8C%83%E6%95%B0-1">矩阵范数</h1>

/* ---------- Design tokens ---------- */
:root {
  --cream:        #F0EEE6;  /* 页面背景 */
  --cream-soft:   #FAF9F5;  /* 代码、引用、表头 */
  --ink:          #1F1B16;  /* 正文 */
  --ink-soft:     #3D3929;  /* 次要文字、h2 */
  --muted:        #6B6557;  /* 说明文字、页码 */
  --rule:         #DAD5C5;  /* 细分割线 */
  --coral:        #CC785C;  /* 主强调色 */
  --coral-deep:   #BD5D3A;  /* 链接、h3、加粗 */
  --coral-soft:   #E8C4B0;  /* 标题页光晕、分隔页点缀 */
  }

/* ---------- 基础版式（中文：Noto Sans SC + 系统黑体回退） ---------- */
section {
  font-family: 'Inter', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 30px;
  color: var(--ink);
  background: var(--cream);
  padding: 60px 72px 56px 72px;
  line-height: 1.55;
  letter-spacing: 0;
}

/* ---------- 标题（中文：Noto Serif SC 宋体系，与 Fraunces 搭配） ---------- */
h1, h2, h3 {
  font-family: 'Fraunces', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', Georgia, serif;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.25;
}
h1 {
  font-size: 44px;
  margin: 0 0 0.25em 0;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--rule);
}
h2 { font-size: 32px; color: var(--ink-soft); margin: 0 0 0.3em 0; }
h3 { font-size: 26px; color: var(--coral-deep); }

/* ---------- 行内元素 ---------- */
strong { color: var(--coral-deep); font-weight: 600; }
em     { color: var(--ink-soft); }
a      { color: var(--coral-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 引用块 ---------- */
blockquote {
  border-left: 3px solid var(--coral);
  background: var(--cream-soft);
  padding: 14px 22px;
  margin: 18px 0;
  color: var(--ink-soft);
  font-style: normal;
}

/* ---------- 插图（居中，§3-15） ---------- */
/* ![w:NNNpx] 只设宽度，图片默认块级左对齐；需 display:block + margin auto 居中
   （社区先例：marp-team discussion #430；本机实测） */
img { display: block; margin: 0 auto; }

/* ---------- 代码 ---------- */
code, pre {
  font-family: 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace;
  background: var(--cream-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.9em;
}
pre { padding: 12px 16px; }

/* ---------- 表格 ---------- */
table {
  font-size: 24px;
  border-collapse: collapse;
  margin: 12px 0;
  width: 100%;
}
th {
  background: var(--cream-soft);
  color: var(--ink-soft);
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--coral);
  padding: 10px 14px;
}
td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
}

/* ---------- 表格居中页: &lt;!-- _class: centered-table --&gt; ---------- */
section.centered-table table {
  width: fit-content !important;
  margin: 12px auto !important;
}

/* ---------- 列表 ---------- */
ul, ol { margin: 0.4em 0 0.4em 1.1em; padding: 0; }
li     { margin: 0.25em 0; }
li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);
  font-size: 56px;
}
section.divider strong { color: var(--coral-soft); }

/* ---------- 编号右对齐（KaTeX \tag 机制） ---------- */
/* \tag{n} 由 KaTeX 自动加括号渲染为 (n)；marp 的 .katex/.katex-html 自带

   故强制 display 层 relative、内两层 static，tag 的 right:0 落在内容区右缘。 */
.katex-display { position: relative; }
.katex-display &gt; .katex { position: static; }
.katex-display &gt; .katex &gt; .katex-html { position: static; }

/* ---------- Design tokens ---------- */
:root {

section {

  font-size: 30px;
  color: var(--ink);
  background: var(--cream);
  padding: 60px 72px 56px 72px;
  line-height: 1.55;
  letter-spacing: 0;
}

/* ---------- 标题（中文：Noto Serif SC 宋体系，与 Fraunces 搭配） ---------- */
h1, h2, h3 {
  font-family: 'Fraunces', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', Georgia, serif;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.25;
}
h1 {
  font-size: 44px;
  margin: 0 0 0.25em 0;
  padding-bottom: 0.35em;
  border-bottom: 1px solid var(--rule);
}
h2 { font-size: 32px; color: var(--ink-soft); margin: 0 0 0.3em 0; }
h3 { font-size: 26px; color: var(--coral-deep); }

/* ---------- 行内元素 ---------- */
strong { color: var(--coral-deep); font-weight: 600; }
em     { color: var(--ink-soft); }
a      { color: var(--coral-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 引用块 ---------- */
blockquote {
  border-left: 3px solid var(--coral);
  background: var(--cream-soft);
  padding: 14px 22px;
  margin: 18px 0;
  color: var(--ink-soft);
  font-style: normal;
}

/* ---------- 插图（居中，§3-15） ---------- */

img { display: block; margin: 0 auto; }

/* ---------- 代码 ---------- */
code, pre {
  font-family: 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace;
  background: var(--cream-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.9em;
}
pre { padding: 12px 16px; }

/* ---------- 表格 ---------- */
table {
  font-size: 24px;
  border-collapse: collapse;
  margin: 12px 0;
  width: 100%;
}
th {
  background: var(--cream-soft);
  color: var(--ink-soft);
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--coral);
  padding: 10px 14px;
}
td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
}

/* ---------- 表格居中页: &lt;!-- _class: centered-table --&gt; ---------- */
section.centered-table table {
  width: fit-content !important;
  margin: 12px auto !important;
}

/* ---------- 列表 ---------- */
ul, ol { margin: 0.4em 0 0.4em 1.1em; padding: 0; }
li     { margin: 0.25em 0; }
li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {

}

  font-size: 60px;

  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);

}
section.divider strong { color: var(--coral-soft); }

.katex-display &gt; .katex { position: static; }
.katex-display &gt; .katex &gt; .katex-html { position: static; }

/* ---------- 代码 ---------- */
code, pre {
  font-family: 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace;
  background: var(--cream-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 0.9em;
}
pre { padding: 12px 16px; }

/* ---------- 表格 ---------- */
table {
  font-size: 24px;
  border-collapse: collapse;
  margin: 12px 0;
  width: 100%;
}
th {
  background: var(--cream-soft);
  color: var(--ink-soft);
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--coral);
  padding: 10px 14px;
}
td {
  border-bottom: 1px solid var(--rule);
  padding: 10px 14px;
}

/* ---------- 表格居中页: &lt;!-- _class: centered-table --&gt; ---------- */
section.centered-table table {
  width: fit-content !important;
  margin: 12px auto !important;
}

/* ---------- 列表 ---------- */
ul, ol { margin: 0.4em 0 0.4em 1.1em; padding: 0; }
li     { margin: 0.25em 0; }
li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);
  font-size: 56px;
}
section.divider strong { color: var(--coral-soft); }

/* ---------- 编号右对齐（KaTeX \tag 机制） ---------- */
/* \tag{n} 由 KaTeX 自动加括号渲染为 (n)；marp 的 .katex/.katex-html 自带
   position:relative（内容宽度盒），会把 tag 的包含块锁死在内容盒上，
   故强制 display 层 relative、内两层 static，tag 的 right:0 落在内容区右缘。 */
.katex-display { position: relative; }
.katex-display &gt; .katex { position: static; }
.katex-display &gt; .katex &gt; .katex-html { position: static; }

li::marker { color: var(--coral); }

/* 分步列表约定：首条 &quot;-&quot; 恒显 + 其余 &quot;*&quot; 分步 → 同一逻辑列表拆成两个 &lt;ul&gt;，收紧间距 */
ul + ul { margin-top: 0; }

/* ---------- 工具类 ---------- */
.small { font-size: 24px; color: var(--muted); }
.cite  { font-size: 20px; color: var(--muted); font-style: italic; }

/* ---------- 页码 ---------- */
section::after {
  color: var(--muted);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 18px;
  font-weight: 400;
}

/* ---------- 标题页: &lt;!-- _class: title --&gt; ---------- */
section.title {
  background:
    radial-gradient(circle at 88% 18%, var(--coral-soft) 0%, transparent 38%),
    var(--cream);
  padding: 96px 96px 80px 96px;
}
section.title h1 {
  font-size: 60px;
  border: none;
  padding: 0;
  line-height: 1.2;
}
section.title h2 {
  font-size: 30px;
  color: var(--coral-deep);
  font-weight: 400;
  margin-top: 0.4em;
}
section.title::after { content: ''; }

/* ---------- 章节分隔页: &lt;!-- _class: divider --&gt; ---------- */
section.divider {
  background: var(--ink);
  color: var(--cream);
  padding: 96px;
}
section.divider h1 {
  color: var(--cream);
  border-color: var(--coral);
  font-size: 56px;
}
section.divider strong { color: var(--coral-soft); }

/* ---------- 编号右对齐（KaTeX \tag 机制） ---------- */
/* \tag{n} 由 KaTeX 自动加括号渲染为 (n)；marp 的 .katex/.katex-html 自带
   position:relative（内容宽度盒），会把 tag 的包含块锁死在内容盒上，
   故强制 display 层 relative、内两层 static，tag 的 right:0 落在内容区右缘。 */
.katex-display { position: relative; }
.katex-display &gt; .katex { position: static; }
.katex-display &gt; .katex &gt; .katex-html { position: static; }
